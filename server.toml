# QuBWic Server Configuration

[server]
address = "127.0.0.1:4433"
# worker_threads = 4                      # Optional: defaults to number of CPU cores
# pid_file = "/var/run/qubwic.pid"        # Optional: PID file path

[quic]
# Maximum idle timeout in milliseconds
max_idle_timeout = 30000
# Initial maximum data (flow control)
initial_max_data = 10485760              # 10MB
# Initial maximum stream data for bidirectional streams
initial_max_stream_data_bidi_local = 1048576
initial_max_stream_data_bidi_remote = 1048576
# Initial maximum stream data for unidirectional streams
initial_max_stream_data_uni = 1048576
# Maximum UDP payload size
max_udp_payload_size = 1350
# Congestion control algorithm: cubic, bbr, reno
congestion_control = "cubic"
# Enable 0-RTT early data
enable_early_data = false
# Maximum concurrent streams
max_streams_bidi = 100
max_streams_uni = 100

[tls]
cert_file = "certs/cert.pem"
key_file = "certs/key.pem"
# alpn = ["h3"]                          # Optional: defaults to ["h3"]
# min_version = "1.3"                    # Optional: always 1.3 for QUIC

[logging]
# Log level: trace, debug, info, warn, error
level = "info"
# Log format: combined, common, json
format = "combined"
# access_log = "/var/log/qubwic/access.log"   # Optional: access log file
# error_log = "/var/log/qubwic/error.log"     # Optional: error log file
